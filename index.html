<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareidolia Lab – Simplified UI</title>
  <meta name="description" content="Explore the boundaries of perception with high-fidelity volumetric cloud patterns.">
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <main>
    <div id="canvas-container"></div>
    <div class="overlay-layer">
      <svg id="annotation-svg" class="annotation-svg" xmlns="http://www.w3.org/2000/svg">
        <g id="tutorial-group" style="opacity: 0; pointer-events: none;">
          <circle id="ghost-cursor" r="15" fill="rgba(255,255,255,0.6)" stroke="white" stroke-width="2" />
          <rect id="ghost-rect" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2" stroke-dasharray="6"
            rx="8" />
        </g>
      </svg>
    </div>

    <!-- Top Navigation -->
    <div class="top-nav">
      <button class="icon-btn-sm" id="help-btn-top" title="How to Discover">
        <svg viewBox="1851 47 22 22" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M1867 64.4302H1863L1858.55 67.3902C1857.89 67.8302 1857 67.3602 1857 66.5602V64.4302C1854 64.4302 1852 62.4302 1852 59.4302V53.4302C1852 50.4302 1854 48.4302 1857 48.4302H1867C1870 48.4302 1872 50.4302 1872 53.4302V59.4302C1872 62.4302 1870 64.4302 1867 64.4302Z" />
          <path
            d="M1862 57.3599V57.1499C1862 56.4699 1862.42 56.1099 1862.84 55.8199C1863.25 55.5399 1863.66 55.1799 1863.66 54.5199C1863.66 53.5999 1862.92 52.8599 1862 52.8599C1861.08 52.8599 1860.34 53.5999 1860.34 54.5199" />
          <path d="M1862 59.75H1862" />
        </svg>
      </button>
    </div>

    <!-- Main Control Bar -->
    <div class="control-bar fade-in">
      <div class="control-group">
        <button class="control-btn" id="generate-clouds" title="Generate Clouds">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
            <path d="M16 19v-4M14 17h4"/>
          </svg>
          <span>Generate Clouds</span>
        </button>
        <button class="control-btn" id="run-pause" title="Run/Pause">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" id="run-pause-svg">
            <!-- Dynamic play/pause set by JS -->
          </svg>
          <span>Run/Pause</span>
        </button>
      </div>
      <div class="control-separator"></div>
      <div class="control-group">
        <div class="popover-wrapper">
          <button class="control-btn" id="wind-direction-toggle" title="Wind Direction">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            <span>Wind Direction</span>
          </button>
          <div class="wind-popover" id="wind-popover" style="display:none;">
            <div class="wind-pad">
               <button class="wind-btn" id="wind-up" title="Wind Up">
                 <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
               </button>
               <button class="wind-btn" id="wind-down" title="Wind Down">
                 <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
               </button>
               <button class="wind-btn" id="wind-left" title="Wind Left">
                 <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
               </button>
               <button class="wind-btn" id="wind-right" title="Wind Right">
                 <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
               </button>
            </div>
          </div>
        </div>
        <button class="control-btn" id="wind-flow" title="Wind Flow">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
          </svg>
          <span>Wind Flow</span>
        </button>
        <button class="control-btn" id="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
        <button class="control-btn" id="fullscreen-btn" title="Fullscreen">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Fullscreen</span>
        </button>
      </div>
    </div>

    <!-- Discovery Modal -->
    <div id="discovery-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <button class="modal-close-x" id="modal-close-x" title="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="modal-header">
          <h2>New Discovery</h2>
        </div>
        <div class="split-view">
          <div class="view-panel">
            <span class="view-label">Original</span>
            <div id="original-view" class="view-canvas"></div>
            <div class="view-actions">
              <button class="icon-btn-sm" id="rotate-left" title="Rotate 90° CCW">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="view-panel">
            <span class="view-label">Contour</span>
            <div id="contour-preview" class="view-canvas"></div>
            <div class="view-actions">
              <div class="threshold-controls">
                <button class="icon-btn-sm" id="threshold-dec" title="Narrower">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <button class="icon-btn-sm" id="threshold-inc" title="Wider">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <input type="text" id="discovery-name" placeholder="Name this discovery..." class="dark-input">
          <div class="modal-actions">
            <button class="modal-btn cancel" id="close-modal">Discard</button>
            <button class="modal-btn save" id="save-discovery">Save Findings</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content settings-content">
        <button class="modal-close-x" id="settings-close-x" title="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="modal-header">
          <h2>Settings</h2>
        </div>
        <div class="settings-grid">
          <div class="setting-row">
            <label>Noise Scale</label>
            <div class="slider-container">
              <input type="range" id="slider-noise" min="0.05" max="0.30" step="0.01">
              <span class="val-display" id="val-noise">0.15</span>
            </div>
          </div>
          <div class="setting-row">
            <label>Complexity (Octaves)</label>
            <div class="slider-container">
              <input type="range" id="slider-octaves" min="2" max="10" step="1">
              <span class="val-display" id="val-octaves">8.00</span>
            </div>
          </div>
          <div class="setting-row">
            <label>Cloud Coverage</label>
            <div class="slider-container">
              <input type="range" id="slider-coverage" min="0" max="1" step="0.05">
              <span class="val-display" id="val-coverage">0.15</span>
            </div>
          </div>
          <div class="setting-row">
            <label>Cloud Density</label>
            <div class="slider-container">
              <input type="range" id="slider-density" min="0.1" max="2" step="0.1">
              <span class="val-display" id="val-density">1.10</span>
            </div>
          </div>
          <div class="setting-row">
            <label>Render Contrast</label>
            <div class="slider-container">
              <input type="range" id="slider-contrast" min="0.5" max="5" step="0.1">
              <span class="val-display" id="val-contrast">2.15</span>
            </div>
          </div>
          <div class="setting-row">
            <label>Drift Speed</label>
            <div class="slider-container">
              <input type="range" id="slider-speed" min="0" max="0.2" step="0.01">
              <span class="val-display" id="val-speed">0.05</span>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="flex-direction: column; align-items: center; gap: 24px;">
          <div class="toggle-container">
            <span class="toggle-label">Night Mode</span>
            <label class="switch">
              <input type="checkbox" id="night-mode-toggle">
              <span class="slider round"></span>
            </label>
          </div>
          <div class="modal-actions" style="justify-content: center; width: 100%;">
            <button class="modal-btn cancel" id="help-btn">Tutorial</button>
            <button class="modal-btn save" id="settings-close">Done</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modular App Entry -->
  <script type="module" src="src/main.js"></script>
</body>

</html>
