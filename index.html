<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareidolia Lab – Simplified UI</title>
  <meta name="description" content="Explore the boundaries of perception with high-fidelity volumetric cloud patterns.">
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <main>
    <div id="canvas-container"></div>
    <div class="overlay-layer">
      <svg id="annotation-svg" class="annotation-svg" xmlns="http://www.w3.org/2000/svg">
        <g id="tutorial-group" style="opacity: 0; pointer-events: none;">
          <circle id="ghost-cursor" r="15" fill="rgba(255,255,255,0.6)" stroke="white" stroke-width="2" />
          <rect id="ghost-rect" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="2" stroke-dasharray="6" rx="8" />
        </g>
      </svg>
    </div>

    <!-- Top Navigation -->
    <div class="top-nav">
      <button class="icon-btn-sm" id="help-btn" title="How to Discover">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>
    </div>

    <!-- Bottom Control Bar -->
    <div class="bottom-controls fade-in">
      <button class="icon-btn" id="random-seed" title="New Random Seed">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <circle cx="15.5" cy="15.5" r="1.5"></circle>
          <circle cx="15.5" cy="8.5" r="1.5"></circle>
          <circle cx="8.5" cy="15.5" r="1.5"></circle>
          <circle cx="12" cy="12" r="1.5"></circle>
        </svg>
      </button>

      <div class="wind-controls">
        <button class="wind-btn" id="wind-up" title="Wind Up">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 4l-8 8h16l-8-8z"/></svg>
        </button>
        <button class="wind-btn" id="wind-down" title="Wind Down">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 20l8-8h-16l8 8z"/></svg>
        </button>
        <button class="wind-btn" id="wind-left" title="Wind Left">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M4 12l8 8v-16l-8 8z"/></svg>
        </button>
        <button class="wind-btn" id="wind-right" title="Wind Right">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 12l-8-8v16l8-8z"/></svg>
        </button>
        <button class="play-btn" id="play-pause">
          <div id="play-icon" style="display: none;">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
          <div id="pause-icon">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </div>
        </button>
      </div>

      <button class="icon-btn" id="snapshot" title="Save Snapshot">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
      </button>
    </div>

    <!-- Discovery Modal -->
    <div id="discovery-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <button class="modal-close-x" id="modal-close-x" title="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <div class="modal-header">
          <h2>New Discovery</h2>
        </div>
        <div class="split-view">
          <div class="view-panel">
            <span class="view-label">Original</span>
            <div id="original-view" class="view-canvas"></div>
            <div class="view-actions">
              <button class="icon-btn-sm" id="rotate-left" title="Rotate 90° CCW">
                <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="1 4 1 10 7 10"></polyline>
                  <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
              </button>
            </div>
          </div>
          <div class="view-panel">
            <span class="view-label">Contour</span>
            <div id="contour-preview" class="view-canvas"></div>
            <div class="view-actions">
              <div class="threshold-controls">
                <button class="icon-btn-sm" id="threshold-dec" title="Narrower">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <button class="icon-btn-sm" id="threshold-inc" title="Wider">
                  <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <input type="text" id="discovery-name" placeholder="Name this discovery..." class="dark-input">
          <div class="modal-actions">
            <button class="modal-btn cancel" id="close-modal">Discard</button>
            <button class="modal-btn save" id="save-discovery">Save Findings</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Night Mode Toggle (Lower Right) -->
    <div class="bottom-right-nav">
      <button class="icon-btn-sm" id="night-mode-toggle" title="Toggle Night Mode">
        <svg id="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </main>

  <!-- Modular App Entry -->
  <script type="module" src="src/main.js"></script>
</body>

</html>
