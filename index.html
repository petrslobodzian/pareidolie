<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pareidolia Lab Elite – Volumetric Visions</title>
  <meta name="description" content="Explore the boundaries of perception with high-fidelity volumetric cloud patterns and cognitive bias injection.">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <aside aria-label="Controls">
    <div class="sidebar-content fade-in">
      <header>
        <h1>Pareidolia Lab <span class="badge">Elite</span></h1>
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;">Volumetric noise + subtle cognitive bias.</p>
      </header>

      <!-- Seed Selection -->
      <div class="control-group">
        <label for="seed-input">Exploration Seed <span class="value-display" id="seed-val"></span></label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="seed-input" placeholder="Enter seed..." style="flex-grow: 1;">
          <button class="btn btn-icon" id="random-seed" title="Randomize Seed">🎲</button>
        </div>
      </div>

      <!-- Cloud Shape Controls -->
      <div class="control-group">
        <label for="scale">Noise Scale <span class="value-display" id="scale-val">4.00</span></label>
        <input type="range" id="scale" min="0.5" max="10.0" step="0.01" value="4.00">
      </div>

      <div class="control-group">
        <label for="octaves">Complexity (Octaves) <span class="value-display" id="octaves-val">4</span></label>
        <input type="range" id="octaves" min="1" max="8" step="1" value="4">
      </div>

      <div class="control-group">
        <label for="coverage">Cloud Coverage <span class="value-display" id="coverage-val">0.50</span></label>
        <input type="range" id="coverage" min="0.0" max="1.0" step="0.01" value="0.50">
      </div>

      <div class="control-group">
        <label for="density">Cloud Density <span class="value-display" id="density-val">0.80</span></label>
        <input type="range" id="density" min="0.0" max="2.0" step="0.01" value="0.80">
      </div>

      <div class="control-group">
        <label for="contrast">Render Contrast <span class="value-display" id="contrast-val">1.20</span></label>
        <input type="range" id="contrast" min="0.5" max="3.0" step="0.01" value="1.20">
      </div>

      <div class="control-group">
        <label for="speed">Drift Speed <span class="value-display" id="speed-val">0.35</span></label>
        <input type="range" id="speed" min="0" max="2.0" step="0.01" value="0.35">
      </div>

      <!-- Bias Injection -->
      <div class="control-group" style="background: rgba(88, 166, 255, 0.05); padding: 16px; border-radius: 12px; border: 1px solid rgba(88, 166, 255, 0.1);">
        <label for="bias">Pareidolia Bias <span class="value-display" id="bias-val">0.20</span></label>
        <input type="range" id="bias" min="0" max="1.0" step="0.01" value="0.20">
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">Subtly injects facial patterns into the cloud flow.</p>
      </div>

      <!-- Discovery List -->
      <div class="control-group" id="annotations-section" style="display: none;">
        <label>Discoveries</label>
        <div id="annotations-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>

      <!-- Action Buttons -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;">
        <button class="btn btn-primary" id="play-pause">Pause</button>
        <button class="btn" id="raw-toggle">Raw Mode</button>
        <button class="btn" id="snapshot">Snapshot</button>
        <button class="btn" id="clear-annotations" style="color: var(--danger);">Clear All</button>
      </div>
    </div>
  </aside>

  <main>
    <div id="canvas-container"></div>
    <div class="overlay-layer">
      <svg id="annotation-svg" class="annotation-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </main>

  <!-- Modular App Entry -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
